{% extends 'base.html' %}
{% block title %}Add Student - BusTrack Pro{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-container">
    <div class="flex-between">
      <div class="page-title">
        <div class="page-title-icon"><i class="fas fa-user-plus"></i></div>
        Add Student
      </div>
      <a href="{% url 'buses:manage_students' %}" class="btn btn-outline btn-sm">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
  </div>
</div>

<div class="content-container" style="max-width: 800px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="card" style="margin-bottom: 1.5rem;">
      <h4 style="margin-bottom: 1.25rem; color: var(--gold);"><i class="fas fa-child" style="margin-right: 8px;"></i> Student Information</h4>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Student ID / Roll Number *</label>
          <input type="text" name="student_id" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Class *</label>
          <input type="text" name="class_name" class="form-control" placeholder="e.g. 5A, 10B" required>
        </div>
        <div class="form-group">
          <label class="form-label">First Name *</label>
          <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name *</label>
          <input type="text" name="last_name" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Section</label>
          <input type="text" name="section" class="form-control" placeholder="e.g. A, B">
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select name="gender" class="form-control">
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="O">Other</option>
          </select>
        </div>
        <div class="form-group" style="grid-column: 1/-1;">
          <label class="form-label">Home Address *</label>
          <textarea name="address" class="form-control" rows="2" required></textarea>
        </div>
        <div class="form-group" style="grid-column: 1/-1;">
          <label class="form-label">Pickup/Drop Location *</label>
          <input type="text" name="pickup_location" class="form-control" placeholder="Describe exact pickup/drop point" required>
        </div>
        <div class="form-group">
          <label class="form-label">Photo (Optional)</label>
          <input type="file" name="photo" class="form-control" accept="image/*">
        </div>
        <div class="form-group">
          <label class="form-label">Assign to Bus</label>
          <select name="bus_id" class="form-control">
            <option value="">-- Select Bus --</option>
            {% for bus in buses %}
            <option value="{{ bus.id }}">{{ bus.bus_name }} ({{ bus.bus_number }})</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
      <h4 style="margin-bottom: 1.25rem; color: var(--gold);"><i class="fas fa-user-friends" style="margin-right: 8px;"></i> Parent / Guardian Details</h4>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Parent Name *</label>
          <input type="text" name="parent_name" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Parent Phone *</label>
          <input type="text" name="parent_phone" class="form-control" placeholder="+91XXXXXXXXXX" required>
        </div>
        <div class="form-group" style="grid-column: 1/-1;">
          <label class="form-label">Parent WhatsApp Number * <span style="color: var(--white-30); font-size: 0.75rem;">(With country code, e.g. +919876543210)</span></label>
          <input type="text" name="parent_whatsapp" class="form-control" placeholder="+91XXXXXXXXXX" required>
        </div>
      </div>
      <hr class="divider">
      <div style="font-size: 0.85rem; font-weight: 600; color: var(--white-60); margin-bottom: 1rem;">Guardian (Optional)</div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Guardian Name</label>
          <input type="text" name="guardian_name" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Guardian Phone</label>
          <input type="text" name="guardian_phone" class="form-control">
        </div>
        <div class="form-group" style="grid-column: 1/-1;">
          <label class="form-label">Guardian WhatsApp</label>
          <input type="text" name="guardian_whatsapp" class="form-control" placeholder="+91XXXXXXXXXX">
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 1rem;">
      <button type="submit" class="btn-primary btn-lg">
        <i class="fas fa-user-plus"></i> Add Student
      </button>
      <a href="{% url 'buses:manage_students' %}" class="btn btn-outline btn-lg">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

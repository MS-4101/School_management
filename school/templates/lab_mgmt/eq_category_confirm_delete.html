{% extends 'base.html' %}
{% block title %}Delete Equipment Category — LibLab{% endblock %}
{% block page_title %}Delete Equipment Category{% endblock %}

{% block content %}
<div class="confirm-card card">
    <div class="card-body">
        <div class="confirm-icon"><span class="material-icons-round" style="font-size:48px">warning</span></div>
        <div class="confirm-text">Are you sure you want to delete equipment category <span class="confirm-name">{{ category.name }}</span>?</div>
        <form method="post" class="confirm-actions">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><span class="material-icons-round" style="font-size:18px">delete</span> Delete</button>
            <a href="{% url 'lab:eq_category_list' %}" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
